<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laura Luo Portfolio</title>
  <meta name="description" content="Laura Luo portfolio" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(17,17,17,.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .title { font-size: 16px; font-weight: 600; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      color: #111;
      background: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .btn.secondary {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,.28);
    }
    .viewer {
      height: calc(100vh - 62px);
      width: 100%;
      border: 0;
      display: block;
      background: #222;
    }
    .fallback {
      display: none;
      padding: 24px 16px 40px;
      max-width: 760px;
      margin: 0 auto;
      line-height: 1.6;
    }
    noscript .fallback { display: block; }
    @media (max-width: 640px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .viewer { height: calc(100vh - 108px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title">Laura Luo Portfolio</div>
    <div class="actions">
      <a class="btn" href="./Laura%20Luo-Portfolio.pdf" target="_blank" rel="noopener">Open PDF</a>
      <a class="btn secondary" href="./Laura%20Luo-Portfolio.pdf" download>Download</a>
    </div>
  </header>

  <iframe class="viewer" src="./Laura%20Luo-Portfolio.pdf#view=FitH" title="Laura Luo Portfolio PDF"></iframe>

  <noscript>
    <div class="fallback">
      JavaScript is not required, but your browser may not preview PDFs inline.
      Please use <a href="./Laura%20Luo-Portfolio.pdf">this direct PDF link</a>.
    </div>
  </noscript>
</body>
</html>
